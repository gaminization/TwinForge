<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TwinForge 3D Viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { background:#08080f; color:#e4e4f0;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       height:100vh; display:flex; flex-direction:column }
header { padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
         border-bottom:1px solid #1e1e30; background:#12121e }
.logo  { font-size:9px; letter-spacing:2px; color:#00c8ff; text-transform:uppercase }
h2     { font-size:15px; font-weight:700; margin-top:2px }
.badge { background:#1e1e30; border:1px solid #2a2a45; border-radius:6px;
         padding:4px 10px; font-size:11px; color:#6c6c90 }
.badge span { color:#00c8ff }
#canvas-wrap { flex:1; position:relative }
canvas { width:100%!important; height:100%!important }
#info  { position:absolute; bottom:14px; left:14px;
         background:rgba(8,8,15,.85); border:1px solid #1e1e30;
         border-radius:10px; padding:10px 14px; font-size:11px;
         color:#6c6c90; line-height:1.9 }
#info span { color:#00c8ff }
#loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
           color:#6c6c90; font-size:13px; text-align:center; pointer-events:none }
#loading .spin { width:32px; height:32px; border:2px solid #1e1e30;
                 border-top-color:#00c8ff; border-radius:50%;
                 animation:spin .8s linear infinite; margin:0 auto 10px }
@keyframes spin { to { transform:rotate(360deg) } }
#controls { position:absolute; top:14px; right:14px; display:flex; flex-direction:column;
             gap:6px }
.btn { background:#12121e; border:1px solid #2a2a45; border-radius:8px;
       padding:6px 12px; font-size:11px; color:#a0a0c0; cursor:pointer;
       transition:all .2s }
.btn:hover { border-color:#00c8ff; color:#00c8ff }
.btn.active { background:#00c8ff22; border-color:#00c8ff; color:#00c8ff }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">TwinForge 3D</div>
    <h2 id="robot-name">Loading…</h2>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="badge">Links: <span id="v-links">–</span></div>
    <div class="badge">Joints: <span id="v-joints">–</span></div>
  </div>
</header>
<div id="canvas-wrap">
  <div id="loading"><div class="spin"></div>Loading meshes…</div>
  <div id="info">
    <span style="color:#00d68f">●</span> Drag to rotate &nbsp;
    <span style="color:#00d68f">●</span> Scroll to zoom<br>
    Robot: <span id="v-robot">–</span> &nbsp;&nbsp;
    Triangles: <span id="v-tris">–</span>
  </div>
  <div id="controls">
    <button class="btn active" id="btn-animate" onclick="toggleAnimate()">⏸ Animate</button>
    <button class="btn" id="btn-wire" onclick="toggleWire()">⬡ Wireframe</button>
    <button class="btn" onclick="resetView()">⊙ Reset View</button>
  </div>
</div>

<script src="/static/three.min.js"></script>
<script>
// ── Three.js setup ────────────────────────────────────────────
const wrap     = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x08080f);
renderer.shadowMap.enabled = true;
wrap.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.001, 50);
camera.position.set(0.35, 0.25, 0.45);
camera.lookAt(0, 0.2, 0);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(1, 2, 1.5); scene.add(sun);
const fill = new THREE.DirectionalLight(0x4488ff, 0.3);
fill.position.set(-1, 0.5, -1); scene.add(fill);

// Grid floor
const grid = new THREE.GridHelper(0.5, 20, 0x1e1e30, 0x1e1e30);
scene.add(grid);

// Orbit controls
let dragging=false, lastX=0, lastY=0;
let theta=0.6, phi=1.25, radius=1.0, cx=0, cy=0.2, cz=0;
function updateCam() {
  camera.position.set(
    cx + radius*Math.sin(phi)*Math.sin(theta),
    cy + radius*Math.cos(phi),
    cz + radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(cx,cy,cz);
}
updateCam();

renderer.domElement.addEventListener('mousedown',  e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
renderer.domElement.addEventListener('mousemove',  e=>{
  if(!dragging)return;
  theta-=(e.clientX-lastX)*0.005;
  phi=Math.max(0.1,Math.min(Math.PI-0.1,phi-(e.clientY-lastY)*0.005));
  lastX=e.clientX;lastY=e.clientY;updateCam();
});
renderer.domElement.addEventListener('mouseup',    ()=>dragging=false);
renderer.domElement.addEventListener('wheel',      e=>{radius=Math.max(0.1,Math.min(3,radius+e.deltaY*0.001));updateCam();},{passive:true});
renderer.domElement.addEventListener('touchstart', e=>{dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY});
renderer.domElement.addEventListener('touchmove',  e=>{
  if(!dragging)return;
  theta-=(e.touches[0].clientX-lastX)*0.005;
  phi=Math.max(0.1,Math.min(Math.PI-0.1,phi-(e.touches[0].clientY-lastY)*0.005));
  lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;updateCam();
});
renderer.domElement.addEventListener('touchend',   ()=>dragging=false);

function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize); resize();

function resetView(){theta=0.6;phi=1.25;radius=1.0;updateCam();}

// ── State ─────────────────────────────────────────────────────
const meshGroups = [];   // {group, pivot, axis, amp, phase}
let animating = true;
let wireframe = false;
let t = 0;
let totalTris = 0;

function toggleAnimate(){
  animating=!animating;
  const btn=document.getElementById('btn-animate');
  btn.textContent=animating?'⏸ Animate':'▶ Animate';
  btn.classList.toggle('active',animating);
}
function toggleWire(){
  wireframe=!wireframe;
  document.getElementById('btn-wire').classList.toggle('active',wireframe);
  meshGroups.forEach(({group})=>{
    group.traverse(o=>{if(o.isMesh)o.material.wireframe=wireframe;});
  });
}

// ── Animation loop ────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if(animating){
    t+=0.016;
    meshGroups.forEach(({joint,axis,amp,phase})=>{
      if(!joint)return;
      const ang=Math.sin(t*0.6+phase)*amp;
      joint.quaternion.setFromAxisAngle(new THREE.Vector3(axis[0],axis[1],axis[2]).normalize(),ang);
    });
  }
  renderer.render(scene,camera);
}
animate();

// ── STL Loader (binary + ASCII) ───────────────────────────────
function parseSTL(buf){
  // Try binary first
  const dv = new DataView(buf);
  const nTris = dv.getUint32(80,true);
  if(nTris*50+84===buf.byteLength){
    // Binary STL
    const geo = new THREE.BufferGeometry();
    const pos=[], norm=[];
    let off=84;
    for(let i=0;i<nTris;i++){
      const nx=dv.getFloat32(off,true),ny=dv.getFloat32(off+4,true),nz=dv.getFloat32(off+8,true);
      off+=12;
      for(let v=0;v<3;v++){
        pos.push(dv.getFloat32(off,true),dv.getFloat32(off+4,true),dv.getFloat32(off+8,true));
        norm.push(nx,ny,nz);
        off+=12;
      }
      off+=2; // attribute byte count
    }
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
    geo.setAttribute('normal',  new THREE.BufferAttribute(new Float32Array(norm),3));
    return {geo, nTris};
  }
  // ASCII STL fallback
  const text=new TextDecoder().decode(buf);
  const geo=new THREE.BufferGeometry();
  const pos=[],norm=[];
  const faceRe=/facet normal ([^\n]+)\n\s*outer loop\n([\s\S]*?)endloop/g;
  const vecRe=/vertex\s+([\d.eE+\-]+)\s+([\d.eE+\-]+)\s+([\d.eE+\-]+)/g;
  let m;
  while((m=faceRe.exec(text))!==null){
    const nv=m[1].trim().split(/\s+/).map(Number);
    let vm;vecRe.lastIndex=0;
    const verts=[];
    while((vm=vecRe.exec(m[2]))!==null)verts.push([+vm[1],+vm[2],+vm[3]]);
    verts.forEach(v=>{pos.push(...v);norm.push(...nv);});
  }
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  geo.setAttribute('normal',  new THREE.BufferAttribute(new Float32Array(norm),3));
  return {geo,nTris:pos.length/9};
}

// Link colours (match demo_arm.py palette)
const LINK_COLORS = [
  0x50505a,  // base      dark grey
  0x2d6dc3,  // shoulder  cobalt
  0x2887d2,  // upper arm sky blue
  0x26a0aa,  // forearm   teal
  0x37b478,  // wrist     green
  0xd27828,  // gripper   orange
];

// ── Load robot from meta + STL files ─────────────────────────
const jobId = location.pathname.split('/').pop();
const srv   = location.origin;

async function loadRobot(){
  if(jobId==='demo'){await buildDemo();return;}
  try{
    const r=await fetch(`${srv}/jobs/${jobId}/meta`);
    if(!r.ok){showError('Job is not finished or failed (HTTP '+r.status+').');return;}
    const meta=await r.json();
    document.getElementById('robot-name').textContent=meta.robot_name||'Robot';
    document.getElementById('v-robot').textContent=meta.robot_name||'–';
    document.getElementById('v-links').textContent=meta.n_links||'–';
    document.getElementById('v-joints').textContent=meta.n_joints||'–';
    await buildFromMeta(meta);
  }catch(e){
    console.warn('meta load failed',e);
    showError(String(e.message||e));
  }
}

async function buildFromMeta(meta){
  // Mirrors the URDF: each link mesh is in its own frame; every joint has a fixed origin
  // (xyz + roll/pitch/yaw, relative to the parent link) and then rotates about its axis.
  const loading=document.getElementById('loading');
  const links=meta.links||[];
  const world=new THREE.Group();
  world.rotation.x=-Math.PI/2;          // URDF is Z-up, three.js is Y-up
  scene.add(world);

  const linkGroup={};
  for(let i=0;i<links.length;i++){
    const lnk=links[i];
    loading.innerHTML=`<div class="spin"></div>Loading mesh ${i+1}/${links.length}…`;
    const res=await fetch(`${srv}${lnk.mesh_url}`);
    if(!res.ok)throw new Error(`mesh ${lnk.id}: HTTP ${res.status}`);
    const {geo,nTris}=parseSTL(await res.arrayBuffer());
    totalTris+=nTris;
    const mat=new THREE.MeshPhongMaterial({
      color:LINK_COLORS[i%LINK_COLORS.length],shininess:60,specular:0x222244,
      side:THREE.DoubleSide});
    const g=new THREE.Group();
    g.add(new THREE.Mesh(geo,mat));
    linkGroup[lnk.id]=g;
  }

  const childIds=new Set((meta.joints||[]).map(j=>j.child));
  links.forEach(l=>{ if(!childIds.has(l.id)) world.add(linkGroup[l.id]); });

  (meta.joints||[]).forEach((j,k)=>{
    const parent=linkGroup[j.parent], child=linkGroup[j.child];
    if(!parent||!child)return;
    const origin=new THREE.Group();
    const o=j.origin_xyz||[0,0,0], r=j.origin_rpy||[0,0,0];
    origin.position.set(o[0],o[1],o[2]);
    origin.rotation.set(r[0],r[1],r[2],'ZYX');      // URDF rpy: R = Rz*Ry*Rx
    const joint=new THREE.Group();
    origin.add(joint); joint.add(child); parent.add(origin);
    const span=Math.min(Math.abs(j.limit_lower??-1),Math.abs(j.limit_upper??1));
    meshGroups.push({group:child,joint,axis:j.axis||[0,0,1],amp:0.6*span,phase:k*0.9});
  });
  if(!meshGroups.length) links.forEach(l=>meshGroups.push({group:linkGroup[l.id]}));

  document.getElementById('v-tris').textContent=totalTris.toLocaleString();
  loading.style.display='none';
}

function showError(msg){
  const l=document.getElementById('loading');
  l.style.display='block'; l.innerHTML='<b>Could not load the model</b><br>'+msg;
}

async function buildDemo(){
  // Uses the real demo output written by `python3 twinforge.py --demo`
  try{
    const r=await fetch(`${srv}/jobs/demo/meta`);
    if(!r.ok)throw new Error('run `python3 twinforge.py --demo` first (no demo output found)');
    const meta=await r.json();
    document.getElementById('robot-name').textContent=(meta.robot_name||'robot')+' (demo)';
    document.getElementById('v-robot').textContent='demo';
    document.getElementById('v-links').textContent=meta.n_links;
    document.getElementById('v-joints').textContent=meta.n_joints;
    await buildFromMeta(meta);
  }catch(e){ showError(String(e.message||e)); }
}

loadRobot();
</script>
</body>
</html>
